---
# RQ worker: consumes the deploy/destroy/monitor jobs the backend enqueues to
# Redis. Required once Redis is present — with Redis, enqueue_job puts jobs on the
# queue instead of running them in-process, so without a worker deploys would
# never execute. Same image/env/SA/config as the backend; command runs the RQ
# worker instead of the API. Single replica for the single-user dedicated CI.
- name: Deploy worker
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: troshka-worker
        namespace: "{{ troshka_namespace }}"
        labels:
          app.kubernetes.io/name: troshka-worker
      spec:
        replicas: 1
        selector:
          matchLabels:
            app.kubernetes.io/name: troshka-worker
        template:
          metadata:
            labels:
              app.kubernetes.io/name: troshka-worker
          spec:
            serviceAccountName: troshka-backend
            containers:
              - name: worker
                image: "{{ troshka_backend_image }}"
                command: ["python3", "-m", "app.workers.deploy_worker"]
                env:
                  - name: POD_NAMESPACE
                    valueFrom:
                      fieldRef:
                        fieldPath: metadata.namespace
                  - name: TROSHKA_DATABASE__URL
                    valueFrom:
                      secretKeyRef:
                        name: troshka-secrets
                        key: database-url
                  - name: TROSHKA_AUTH__JWT_SECRET
                    valueFrom:
                      secretKeyRef:
                        name: troshka-secrets
                        key: jwt-secret
                  - name: TROSHKA_AUTH__ENCRYPTION_KEY
                    valueFrom:
                      secretKeyRef:
                        name: troshka-secrets
                        key: encryption-key
                  - name: TROSHKA_S3__ACCESS_KEY_ID
                    valueFrom:
                      secretKeyRef:
                        name: troshka-secrets
                        key: s3-access-key
                  - name: TROSHKA_S3__SECRET_ACCESS_KEY
                    valueFrom:
                      secretKeyRef:
                        name: troshka-secrets
                        key: s3-secret-key
                  - name: TROSHKA_REDIS__URL
                    value: "redis://troshka-redis.{{ troshka_namespace }}.svc:6379/0"
                volumeMounts:
                  - name: config
                    mountPath: /opt/app-root/src/config
                resources:
                  requests:
                    cpu: "{{ troshka_backend_cpu_request }}"
                  limits:
                    memory: "{{ troshka_backend_memory_limit }}"
            volumes:
              - name: config
                configMap:
                  name: troshka-config
