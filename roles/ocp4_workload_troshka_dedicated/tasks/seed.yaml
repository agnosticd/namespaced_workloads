---
# Library seeding for the dedicated Troshka.
#
# The gold images live in the central S4 bucket under Troshka's native nested
# layout (library/<library-uuid>/<image-uuid>/<Display Name>.ext). Rather than
# pre-copying by hard-coded flat keys, we register the central bucket as a
# read-only library source (see configure.yaml) and let the backend resolve
# each image from library/manifest.json via /library/sync-central. Default tags
# (ocp_default_iso / ocp_default_image) are carried in the manifest and applied
# on import. Central items are read-only, so they must not be PATCHed from here.
# Image data is pulled on demand at deploy time (cold-storage model).
- name: Skip seeding if no central S3 configured
  when: troshka_seed_s3_endpoint | default('') == '' or troshka_seed_images | length == 0
  ansible.builtin.debug:
    msg: "No central S3 configured, skipping library seeding"

- name: Seed library from central S4 via manifest
  when: troshka_seed_s3_endpoint | default('') != '' and troshka_seed_images | length > 0
  block:
    - name: Sync central library (reads library/manifest.json from the gold bucket)
      kubernetes.core.k8s_exec:
        namespace: "{{ troshka_namespace }}"
        pod: "{{ _backend_pod }}"
        container: backend
        command: >-
          curl -sf -X POST http://localhost:8200/api/v1/library/sync-central
          -H "X-Forwarded-Email: {{ _requester_identity }}"
      register: _sync_central
      until: _sync_central.rc == 0
      retries: 30
      delay: 10

    - name: Wait until all seed images are present in the library
      kubernetes.core.k8s_exec:
        namespace: "{{ troshka_namespace }}"
        pod: "{{ _backend_pod }}"
        container: backend
        command: >-
          curl -sf http://localhost:8200/api/v1/library/
          -H "X-Forwarded-Email: {{ _requester_identity }}"
      register: _library
      until:
        - _library.rc == 0
        - (troshka_seed_images | map(attribute='name') | list)
          | difference((_library.stdout | from_json) | map(attribute='name') | list)
          | length == 0
      retries: 30
      delay: 10

    - name: Report seed status
      ansible.builtin.debug:
        msg: "Library synced from central: {{ (_library.stdout | from_json) | length }} items"
