---
# Redis backs the RQ job queue, progress/state stores, and pub/sub. Without it
# Troshka falls back to per-process in-memory stores, which don't survive across
# the backend's API and deploy/monitor processes — so OCP installs complete but
# the install log/progress and VM status never show. (infra01's Helm chart ships
# Redis by default; this inline dedicated-CI role was missing it.)
- name: Deploy Redis
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: troshka-redis
        namespace: "{{ troshka_namespace }}"
        labels:
          app.kubernetes.io/name: troshka-redis
      spec:
        replicas: 1
        selector:
          matchLabels:
            app.kubernetes.io/name: troshka-redis
        template:
          metadata:
            labels:
              app.kubernetes.io/name: troshka-redis
          spec:
            containers:
              - name: redis
                image: registry.redhat.io/rhel9/redis-7:latest
                ports:
                  - containerPort: 6379
                readinessProbe:
                  exec:
                    command: ["redis-cli", "ping"]
                  initialDelaySeconds: 3
                  periodSeconds: 5
                livenessProbe:
                  exec:
                    command: ["redis-cli", "ping"]
                  initialDelaySeconds: 5
                  periodSeconds: 10
                resources:
                  requests:
                    cpu: 100m
                    memory: 128Mi
                  limits:
                    memory: 256Mi

- name: Create Redis Service
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: troshka-redis
        namespace: "{{ troshka_namespace }}"
      spec:
        selector:
          app.kubernetes.io/name: troshka-redis
        ports:
          - port: 6379
            targetPort: 6379

- name: Wait for Redis to be ready
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    name: troshka-redis
    namespace: "{{ troshka_namespace }}"
  register: _redis
  until: (_redis.resources[0].status.readyReplicas | default(0)) >= 1
  retries: 30
  delay: 10
