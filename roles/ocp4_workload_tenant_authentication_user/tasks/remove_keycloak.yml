---
# Remove Keycloak user

- name: Get Keycloak route
  kubernetes.core.k8s_info:
    api_version: route.openshift.io/v1
    kind: Route
    name: keycloak
    namespace: "{{ ocp4_workload_tenant_authentication_user_keycloak_namespace }}"
  register: r_keycloak_route

- name: Get Keycloak admin credentials
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: keycloak-initial-admin
    namespace: "{{ ocp4_workload_tenant_authentication_user_keycloak_namespace }}"
  register: r_keycloak_admin_secret

- name: Delete Keycloak user
  when:
  - r_keycloak_route.resources | length > 0
  - r_keycloak_admin_secret.resources | length > 0
  block:
  - name: Set Keycloak facts
    ansible.builtin.set_fact:
      _keycloak_url: "https://{{ r_keycloak_route.resources[0].spec.host }}"
      _keycloak_admin_user: "{{ r_keycloak_admin_secret.resources[0].data.username | b64decode }}"
      _keycloak_admin_password: "{{ r_keycloak_admin_secret.resources[0].data.password | b64decode }}"

  - name: Get Keycloak admin access token
    ansible.builtin.uri:
      url: "{{ _keycloak_url }}/realms/master/protocol/openid-connect/token"
      method: POST
      body_format: form-urlencoded
      body:
        username: "{{ _keycloak_admin_user }}"
        password: "{{ _keycloak_admin_password }}"
        grant_type: password
        client_id: admin-cli
      validate_certs: false
      status_code: 200
    register: r_keycloak_admin_token

  - name: Get user ID from Keycloak
    ansible.builtin.uri:
      url: >-
        {{ _keycloak_url }}/admin/realms/{{
        ocp4_workload_tenant_authentication_user_keycloak_realm
        }}/users?username={{ ocp4_workload_tenant_authentication_user_username }}
      method: GET
      headers:
        Authorization: "Bearer {{ r_keycloak_admin_token.json.access_token }}"
      validate_certs: false
      status_code: 200
    register: r_keycloak_user_search

  - name: Delete Keycloak user by ID
    when: r_keycloak_user_search.json | length > 0
    ansible.builtin.uri:
      url: >-
        {{ _keycloak_url }}/admin/realms/{{
        ocp4_workload_tenant_authentication_user_keycloak_realm
        }}/users/{{ r_keycloak_user_search.json[0].id }}
      method: DELETE
      headers:
        Authorization: "Bearer {{ r_keycloak_admin_token.json.access_token }}"
      validate_certs: false
      status_code: [204, 404]
