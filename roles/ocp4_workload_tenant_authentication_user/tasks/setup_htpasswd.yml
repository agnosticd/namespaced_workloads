---
# Add a single user to the existing htpasswd authentication

- name: Set user password if not provided
  when: ocp4_workload_tenant_authentication_user_password == ""
  ansible.builtin.set_fact:
    _ocp4_workload_tenant_authentication_user_password: >-
      {{
        lookup('password', '/dev/null',
          chars=['ascii_letters','digits'],
          length=ocp4_workload_tenant_authentication_user_password_length
        )
      }}

- name: Use provided password
  when: ocp4_workload_tenant_authentication_user_password != ""
  ansible.builtin.set_fact:
    _ocp4_workload_tenant_authentication_user_password: "{{ ocp4_workload_tenant_authentication_user_password }}"

- name: Get existing htpasswd secret
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: "{{ ocp4_workload_tenant_authentication_user_htpasswd_secret_name }}"
    namespace: "{{ ocp4_workload_tenant_authentication_user_htpasswd_secret_namespace }}"
  register: r_existing_htpasswd_secret

- name: Fail if htpasswd secret does not exist
  when: r_existing_htpasswd_secret.resources | length == 0
  ansible.builtin.fail:
    msg: >-
      HTPasswd secret {{ ocp4_workload_tenant_authentication_user_htpasswd_secret_name }}
      does not exist in namespace {{ ocp4_workload_tenant_authentication_user_htpasswd_secret_namespace }}.
      Ensure the cluster authentication workload has been deployed first.

- name: Decode existing htpasswd data
  ansible.builtin.set_fact:
    _existing_htpasswd_content: "{{ r_existing_htpasswd_secret.resources[0].data.htpasswd | b64decode }}"

- name: Write existing htpasswd to temp file
  ansible.builtin.copy:
    content: "{{ _existing_htpasswd_content }}"
    dest: /tmp/htpasswd-{{ ocp4_workload_tenant_authentication_user_username }}
    mode: '0600'
  register: r_htpasswd_temp_file

- name: Add user to htpasswd file
  changed_when: false
  ansible.builtin.command: >-
    htpasswd -b {{ r_htpasswd_temp_file.dest | ansible.builtin.quote }}
    {{ ocp4_workload_tenant_authentication_user_username | ansible.builtin.quote }}
    {{ _ocp4_workload_tenant_authentication_user_password | ansible.builtin.quote }}

- name: Read updated htpasswd file
  ansible.builtin.slurp:
    src: "{{ r_htpasswd_temp_file.dest }}"
  register: r_updated_htpasswd_file

- name: Remove temporary htpasswd file
  ansible.builtin.file:
    path: "{{ r_htpasswd_temp_file.dest }}"
    state: absent

- name: Update htpasswd secret
  kubernetes.core.k8s:
    state: present
    resource_definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ ocp4_workload_tenant_authentication_user_htpasswd_secret_name }}"
        namespace: "{{ ocp4_workload_tenant_authentication_user_htpasswd_secret_namespace }}"
      data:
        htpasswd: "{{ r_updated_htpasswd_file.content }}"
  register: r_htpasswd_secret_update
  retries: 5
  delay: 10
  until: r_htpasswd_secret_update is success

- name: Print user information
  agnosticd.core.agnosticd_user_info:
    msg: >-
      HTPasswd user `{{ ocp4_workload_tenant_authentication_user_username }}`
      created with password `{{ _ocp4_workload_tenant_authentication_user_password }}`.
